name: granize-services

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initialize.sql:/docker-entrypoint-initdb.d/00-granize.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_RELAY_HOST: ${GMAIL_SMTP_HOST:-}
      MP_SMTP_RELAY_PORT: ${GMAIL_SMTP_PORT:-587}
      MP_SMTP_RELAY_STARTTLS: ${GMAIL_SMTP_STARTTLS:-true}
      MP_SMTP_RELAY_AUTH: ${GMAIL_SMTP_AUTH:-login}
      MP_SMTP_RELAY_USERNAME: ${GMAIL_SMTP_EMAIL:-}
      MP_SMTP_RELAY_PASSWORD: ${GMAIL_SMTP_APP_PASSWORD:-}
      MP_SMTP_RELAY_RETURN_PATH: ${GMAIL_SMTP_EMAIL:-}
      MP_SMTP_RELAY_OVERRIDE_FROM: ${GMAIL_SMTP_EMAIL:-}
      MP_SMTP_RELAY_FWD_SMTP_ERRORS: "true"
      MP_SMTP_RELAY_ALL: ${GMAIL_SMTP_ENABLED:-false}
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    environment:
      WHISPER__MODEL: Systran/faster-whisper-small
      WHISPER__COMPUTE_TYPE: int8
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - whisper_cache:/root/.cache/huggingface

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"
      LOG_LEVEL: ERROR,WARN
      LOG_COLOR: "true"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: granize_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: granize
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: 30
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  n8n-init:
    image: docker.n8n.io/n8nio/n8n:2.6.4
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &n8n-environment
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      GRANIZE_SITE_URL: ${GRANIZE_SITE_URL}
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      MAILPIT_API_URL: http://mailpit:8025
    entrypoint: ["/bin/sh", "/scripts/import-workflows.sh"]
    volumes:
      - ./n8n/workflows:/workflows:ro
      - ./n8n/import-workflows.sh:/scripts/import-workflows.sh:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.6.4
    restart: unless-stopped
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      whisper:
        condition: service_started
    environment:
      <<: *n8n-environment
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  n8n_data:
  mailpit_data:
  whisper_cache:
